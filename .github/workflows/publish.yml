name: Publish NuGet Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write  # GitHub OIDC token for nuget.org Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Mediator/Mediator.csproj

      - name: Build
        run: dotnet build src/Mediator/Mediator.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack src/Mediator/Mediator.csproj -c Release --no-build -o ./nupkg

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source https://nuget.pkg.github.com/TanNguyenNet/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # Trusted Publishing: exchange the OIDC token for a 1-hour nuget.org API key right before pushing
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
